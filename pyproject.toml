[project]
name = "edgar-diff"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "selectolax>=0.3",
    "rapidfuzz>=3.9",
    "scipy>=1.13",
]

[project.scripts]
edgar = "edgar_diff.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
